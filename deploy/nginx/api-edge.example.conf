# A7 — Reverse-proxy **fragments** for the Nest API (TLS termination + basic rate limits).
# Your WAF/CDN (Cloudflare, AWS WAF, etc.) should sit **in front** of nginx when the API is public.
#
# Usage:
# 1. In the top-level `http { }` block of nginx.conf, add the `limit_req_zone` directives below.
# 2. Add the `server { }` block (or merge `location`s into an existing TLS server).
# 3. Set `TRUST_PROXY=true` on the API and forward `X-Forwarded-For` / `X-Forwarded-Proto`.
#
# Upstream assumes the API container/service is named `api` (see deploy/docker-compose.prod.yml).
#
# Full narrative: docs/PRODUCTION.md § Edge / WAF (A7).

# --- http { } context (zones must be declared once per nginx) ---
#
# limit_req_zone $binary_remote_addr zone=api_public_per_ip:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=api_auth_per_ip:10m rate=10r/m;

upstream car_rental_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Restrict /v1/metrics to observability IPs (replace with your Prometheus / VPC CIDRs).
    location = /v1/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://car_rental_api;
    }

    location /v1/auth/ {
        limit_req zone=api_auth_per_ip burst=20 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://car_rental_api;
    }

    location / {
        limit_req zone=api_public_per_ip burst=80 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://car_rental_api;
    }
}
