name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: npm run build -w @car-rental/shared
      - run: npm run build -w @car-rental/api
      - run: npm run build -w @car-rental/web
      - run: npm run build -w @car-rental/worker
      - run: npm run lint
