# Local development — PostgreSQL + Redis (BullMQ).
# Start: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rental-pg
    environment:
      POSTGRES_USER: carrental
      POSTGRES_PASSWORD: carrental
      POSTGRES_DB: carrental
    ports:
      - "5432:5432"
    volumes:
      - car_rental_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: car-rental-redis
    ports:
      - "6379:6379"

  # Optional: S3-compatible API for presigned agreement attachments (set STORAGE_MODE=s3 + env in apps/api/.env)
  minio:
    image: minio/minio:latest
    container_name: car-rental-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - car_rental_minio:/data

volumes:
  car_rental_pgdata:
  car_rental_minio:
